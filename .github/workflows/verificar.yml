# Revisa que todo compile en cualquier rama que no sea "main" (y en los pull
# requests), sin publicar nada: análisis, pruebas, versión web, APK de prueba
# y funciones de Firebase. La versión web queda como artefacto (zentory-web.zip).
name: Verificar cambios

on:
  push:
    branches-ignore: [main, gh-pages]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      # Falla solo con errores (los avisos de estilo no detienen la revisión).
      - name: Análisis de código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas
        run: flutter test

      - name: Compilar versión web
        run: |
          flutter build web --release --base-href /zentory/app/ --no-web-resources-cdn --build-number=${{ github.run_number }}
          rm -rf webpkg && mkdir -p webpkg/zentory/app
          cp -r build/web/. webpkg/zentory/app/
          (cd webpkg && zip -qr ../zentory-web.zip zentory)

      - name: Compilar APK de prueba (Android)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Guardar versión web
        uses: actions/upload-artifact@v5
        with:
          name: zentory-web
          path: zentory-web.zip

  funciones:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Dependencias
        run: npm install --no-audit --no-fund
      - name: Pruebas
        run: npm test
      - name: Cargar las funciones
        run: node -e "const f = require('./index.js'); console.log('Funciones:', Object.keys(f).join(', '))"
