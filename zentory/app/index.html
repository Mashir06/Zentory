<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    /zentory/app/ lo reemplaza `flutter build web --base-href`.
    Zentory web se publica en https://nubiksoft.com/zentory/app/
  -->
  <base href="/zentory/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Zentory: control de vencimientos para minisúper y tiendas de barrio.">
  <meta name="theme-color" content="#0F172A">

  <!-- iPhone / iPad: se instala desde Safari con "Agregar a pantalla de inicio" -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Zentory">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Se adelanta la conexión a Firebase y la descarga del código de la app -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">
  <title>Zentory</title>

  <style>
    html, body { margin: 0; height: 100%; background: #0F172A; }
    /* Pantalla de carga hasta que arranca la app */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(70% 50% at 50% 45%, #18264a, #0F172A 70%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #94A3B8; transition: opacity .3s ease;
    }
    #splash img { width: 120px; height: auto; }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: #1E293B; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #10B981;
      animation: zload 1.1s ease-in-out infinite;
    }
    @keyframes zload { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/splash-logo.png" alt="Zentory">
    <div class="bar"></div>
  </div>
  <script>
    // Quita la pantalla de carga cuando Flutter dibuja su primer cuadro.
    window.addEventListener("flutter-first-frame", function () {
      var s = document.getElementById("splash");
      if (!s) return;
      s.style.opacity = "0";
      setTimeout(function () { s.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
