# Compila el APK de Zentory en cada cambio a "main" y lo publica en Releases.
# Descarga directa de la última versión:
#   https://github.com/Mashir06/Zentory/releases/latest/download/zentory.apk
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis de código
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analisis.txt
        continue-on-error: true

      - name: Pruebas
        run: |
          set -o pipefail
          flutter test 2>&1 | tee pruebas.txt
        continue-on-error: true

      - name: Configurar firma (si hay secretos)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Firma: llave del repositorio."
          else
            echo "::warning::Sin secretos de firma: el APK se firma con una llave de depuración temporal. Para instalar una versión nueva tendrás que desinstalar la anterior."
          fi

      # Un APK por tipo de procesador: mucho más livianos que uno universal.
      - name: Compilar APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} 2>&1 | tee compilacion.txt

      # Si algo falla, los errores se muestran como avisos del workflow (se ven
      # sin iniciar sesión en GitHub).
      - name: Mostrar errores
        if: failure()
        run: |
          { grep -E "error •|Error:|error:" analisis.txt compilacion.txt pruebas.txt 2>/dev/null || true; } \
            | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done

      - name: Renombrar APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk zentory.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk zentory-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk zentory-x86_64.apk
          ls -la zentory*.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: zentory-apk
          path: |
            zentory*.apk
            analisis.txt
            pruebas.txt

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zentory (compilación ${{ github.run_number }})
          body: |
            APK compilado automáticamente desde el commit ${{ github.sha }}.

            Descarga **zentory.apk** (abajo, en "Assets"): sirve para casi todos los
            teléfonos actuales (procesador de 64 bits, como OPPO Find X9 Pro).

            - `zentory-armeabi-v7a.apk`: solo para teléfonos antiguos de 32 bits.
            - `zentory-x86_64.apk`: para emuladores.
            - `analisis.txt` y `pruebas.txt`: resultados de `flutter analyze` y `flutter test`.
          files: |
            zentory.apk
            zentory-armeabi-v7a.apk
            zentory-x86_64.apk
            analisis.txt
            pruebas.txt
          make_latest: true
