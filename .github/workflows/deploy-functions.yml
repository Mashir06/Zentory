# Prueba y despliega las Cloud Functions (avisos push de vencimiento).
# El despliegue necesita el secreto FIREBASE_SERVICE_ACCOUNT (ver README.md).
# Sin ese secreto, solo se prueban las funciones.
name: Desplegar Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Dependencias
        run: npm install --no-audit --no-fund

      - name: Pruebas
        run: npm test

      - name: Comprobar que las funciones cargan
        run: node -e "const f = require('./index.js'); console.log(Object.keys(f))"

      - name: Desplegar en Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT: las funciones no se desplegaron."
            exit 0
          fi
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cd ..
          npx --yes firebase-tools@latest deploy --only functions \
            --project zentory-base --non-interactive --force
